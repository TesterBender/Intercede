name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v5 of both actions bundles Node 24; v4 bundled the deprecated Node 20
      # and warned on every run.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 24, because the runner forces it anyway now that 20 is deprecated —
          # pinning a version the run cannot honour proves nothing.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
